# Render Blueprint for Unicolors Task Diary - FREE plan (temporary/testing).
# Free plan limits: the site sleeps after ~15 min idle (first visit then takes ~1 min),
# uploaded attachments/voice notes are wiped on every restart or deploy,
# daily reminders only run while the site is awake, and the free database expires after ~30 days.
# On Render: New > Blueprint > pick this repo. Fill in the "sync: false" values when asked.
databases:
  - name: unicolors-diary-db
    plan: free
    databaseName: unicolors_diary
    user: unicolors

services:
  - type: web
    name: unicolors-task-diary
    runtime: python
    plan: free
    rootDir: UnicolorDairy
    buildCommand: bash build.sh   # build.sh isn't marked executable in git, so call it via bash
    # ONE worker on purpose: each worker starts the daily reminder thread,
    # so more workers would send every reminder email several times.
    startCommand: gunicorn UnicolorDairy.wsgi:application --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: unicolors-diary-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_HTTPS
        value: "1"
      # Brevo API key: emails go through Brevo because the free plan blocks SMTP
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # First admin login, created automatically during the build
      # (the free plan has no Shell tab to run createsuperuser).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
