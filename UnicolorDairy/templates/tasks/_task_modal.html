{# Task detail pop-up. Included by the board, search and report pages. #}
{% load static %}
<script src="{% static 'js/mentions.js' %}"></script>

<dialog class="modal" id="taskModal" data-url="{% url 'task_detail' 0 %}" aria-label="Task details">
  <div class="modal-inner" data-modal-body></div>
</dialog>

<script>
// Click a card to see its full details (and, for admins, edit it).
(function () {
  const dlg = document.getElementById("taskModal");
  if (!dlg) return;
  const body = dlg.querySelector("[data-modal-body]");
  const here = () => encodeURIComponent(location.pathname + location.search);

  function failed(status, url) {
    const why = status === 403 ? "You don't have access to this task."
              : status === 404 ? "This task no longer exists, or the task page isn't set up yet (check urls.py)."
              : "The server hit an error (" + status + ").";
    body.innerHTML = '<div class="empty">' + why + '</div>' +
      '<div class="actions">' + (status >= 500 ? '<a class="btn sm" target="_blank" href="' + url + '">See error details</a>' : '') +
      '<button type="button" class="sm" data-close>Close</button></div>';
  }

  // Load any page fragment (task details, edit form) into the pop-up.
  async function load(url) {
    body.innerHTML = '<div class="empty">Loading…</div>';
    if (!dlg.open) dlg.showModal();
    try {
      const r = await fetch(url, { headers: { "X-Requested-With": "fetch" } });
      if (!r.ok) return failed(r.status, url);
      body.innerHTML = await r.text();
      if (window.Mentions) {
        Mentions.initComments(body, Mentions.readPeople("comment-people"));
        const edit = body.querySelector("textarea[name=details]");
        if (edit) Mentions.attach(edit, Mentions.readPeople("edit-people"));
      }
    } catch (e) {
      body.innerHTML = '<div class="empty">Couldn\'t reach the server. Check that it is running, then try again.</div>' +
        '<div class="actions"><button type="button" class="sm" data-close>Close</button></div>';
    }
  }

  function openTask(id) {
    load(dlg.dataset.url.replace("/0/", "/" + id + "/") + "?next=" + here());
  }
  window.openTaskModal = openTask;

  // Board cards, and any element marked data-open-task="ID" (search results, report log, approval queue).
  document.querySelectorAll(".board .card, [data-open-task]").forEach(el => {
    const id = el.dataset.openTask || el.dataset.id;
    el.addEventListener("click", e => {
      // Buttons, links, note boxes and audio keep working as before.
      if (e.target.closest("a, button, form, details, summary, audio, textarea, input, select")) return;
      if (String(window.getSelection())) return;   // user was selecting text
      openTask(id);
    });
    if (el.dataset.openTask) el.addEventListener("keydown", e => {
      if (e.target !== el) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTask(id); }
    });
  });

  dlg.addEventListener("click", e => {
    const loadLink = e.target.closest("[data-modal-load]");      // e.g. "Edit task"
    if (loadLink) { e.preventDefault(); load(loadLink.href); return; }
    const back = e.target.closest("[data-back-to-task]");        // "Cancel" on the edit form
    if (back) { openTask(back.dataset.backToTask); return; }
    if (e.target === dlg || e.target.closest("[data-close]")) dlg.close();   // backdrop or close button
  });
  dlg.addEventListener("close", () => body.querySelectorAll("audio").forEach(a => a.pause()));

  // Opened from a notification link (…#task-12): show that task straight away.
  const m = location.hash.match(/^#task-(\d+)$/);
  if (m) openTask(m[1]);
})();
</script>
