{% extends "base.html" %}

{% block content %}

<div class="narrow">
    <div class="panel">

        <h2>Reset Password</h2>

        <p class="muted">
            Enter your email address and we'll send you a password reset link.
        </p>

        <form method="post" class="stack">

            {% csrf_token %}

            {% for field in form %}

                <label>
                    {{ field.label }}
                    {{ field }}
                </label>

                {% for error in field.errors %}
                    <div class="err">
                        {{ error }}
                    </div>
                {% endfor %}

            {% endfor %}

            <button
                type="submit"
                class="primary"
            >
                Send Reset Link
            </button>

        </form>

        <div style="margin-top:18px;">
            <a href="{% url 'login' %}" class="link">
                ← Back to login
            </a>
        </div>

    </div>
</div>

{% endblock %}
