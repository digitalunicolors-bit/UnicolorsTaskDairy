{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <div class="panel">
    <h2>Change your password</h2>
    <form method="post" class="stack">
      {% csrf_token %}
      {% for field in form %}
        <label>{{ field.label }}{{ field }}</label>
        {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
      {% endfor %}
      <button class="primary" type="submit">Save new password</button>
    </form>
  </div>
</div>
{% endblock %}
