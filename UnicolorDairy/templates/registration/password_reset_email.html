<!DOCTYPE html>
<html>
<body style="
    margin:0;
    padding:0;
    background:#f4f5f7;
    font-family:Arial,Helvetica,sans-serif;
">

<table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="padding:40px 20px;"
>

<tr>
<td align="center">

<table
    width="560"
    cellpadding="0"
    cellspacing="0"
    style="
        width:100%;
        max-width:560px;
        background:#ffffff;
        border-radius:14px;
        padding:40px;
    "
>

<tr>
<td>

<h2 style="
    margin:0 0 24px;
    color:#111827;
">
    Reset your password
</h2>

<p style="
    color:#4b5563;
    font-size:16px;
    line-height:1.6;
">
    Hi {{ user.display_name }},
</p>

<p style="
    color:#4b5563;
    font-size:16px;
    line-height:1.6;
">
    We received a request to reset your
    <strong>Unicolors Workspace</strong> password.
</p>

<p style="
    color:#4b5563;
    font-size:16px;
    line-height:1.6;
">
    Click the button below to create a new password.
</p>

<div style="margin:32px 0;">

<a
    href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
    style="
        display:inline-block;
        padding:14px 28px;
        background:#ed4650;
        color:#ffffff;
        text-decoration:none;
        border-radius:8px;
        font-weight:600;
    "
>
    Reset Password
</a>

</div>

<p style="
    color:#9ca3af;
    font-size:13px;
    line-height:1.6;
">
    If you didn't request this password reset,
    you can safely ignore this email.
</p>

</td>
</tr>

</table>

</td>
</tr>

</table>

</body>
</html>
